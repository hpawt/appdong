services:
  db:
    image: postgres:17
    restart: unless-stopped
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_USER: appdong
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-appdong_local}
      POSTGRES_DB: appdong
    volumes:
      - postgresdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U appdong -d appdong']
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  postgresdata:
